{% extends "base.html" %}

{% block title %}Caramel - Regístrate{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[90vh] py-4 px-4"
  x-data="{ 
    email: '{{ form_data.email if form_data and form_data.email else '' }}',
    isSubmitting: false,
    get isUnimarEmail() { 
      return this.email.trim().toLowerCase().endsWith('@unimar.edu.ve') && this.email.split('@')[0].length >= 2;
    },
    get hasAtSign() { 
      return this.email.includes('@'); 
    }
  }">

  <!-- Header Collage & Visual Banner -->
  <div class="relative w-full max-w-[380px] h-44 rounded-3xl overflow-hidden mb-4 border border-caramel-500/20 shadow-xl">
    <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=800" class="w-full h-full object-cover brightness-75 contrast-110" alt="Caramel">
    <div class="absolute inset-0 bg-gradient-to-t from-[#1b1410] via-[#1b1410]/50 to-transparent"></div>
    
    <!-- Floating Caramel Brand Monogram -->
    <div class="absolute inset-0 flex flex-col items-center justify-center">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-600 via-amber-400 to-amber-200 p-0.5 shadow-2xl">
        <div class="w-full h-full bg-[#201813] rounded-2xl flex items-center justify-center">
          <svg class="w-8 h-8 text-caramel-400 drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </div>
      </div>
      <h1 class="text-xl font-bold tracking-wide text-[#fdf7f1] mt-2 font-serif">Caramel</h1>
    </div>
  </div>

  <!-- Form Card -->
  <div class="w-full max-w-[380px] bg-[#241c17] p-6 rounded-3xl border border-caramel-500/20 shadow-2xl">
    <div class="text-center mb-5">
      <h2 class="text-xl font-bold text-[#fcf8f3]">Regístrate</h2>
      <p class="text-xs text-stone-400 mt-1">Crea tu cuenta institucional UNIMAR</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 rounded-2xl bg-red-950/70 border border-red-500/40 text-red-300 text-xs text-center space-y-1">
      <p class="font-semibold">{{ error }}</p>
    </div>
    {% endif %}

    <form method="POST" action="/register" @submit="isSubmitting = true" class="space-y-3.5">
      <!-- Nombre Completo -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Nombre completo</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">👤</span>
          <input type="text" name="full_name" required placeholder="Tu nombre y apellido"
            value="{{ form_data.full_name if form_data and form_data.full_name else '' }}"
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border border-caramel-500/25 rounded-2xl text-xs text-stone-200 placeholder-stone-600 focus:outline-none focus:border-caramel-400 transition">
        </div>
      </div>

      <!-- Correo Institucional Obligatorio -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Correo institucional (@unimar.edu.ve)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">✉</span>
          <input type="email" name="email" required placeholder="nombre.apellido@unimar.edu.ve"
            x-model="email"
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border rounded-2xl text-xs text-stone-200 placeholder-stone-600 focus:outline-none transition font-mono"
            :class="isUnimarEmail ? 'border-emerald-500/50 focus:border-emerald-400' : (hasAtSign ? 'border-amber-500/40 focus:border-amber-400' : 'border-caramel-500/25 focus:border-caramel-400')">
        </div>
        
        <!-- Live Domain Feedback Hint -->
        <div class="text-[10px] mt-1 ml-1">
          <template x-if="!email">
            <span class="text-stone-500">Exclusivo para la comunidad universitaria UNIMAR</span>
          </template>
          <template x-if="email && isUnimarEmail">
            <span class="text-emerald-400 font-medium flex items-center space-x-1">
              <span>✓</span>
              <span>Dominio institucional válido</span>
            </span>
          </template>
          <template x-if="email && hasAtSign && !isUnimarEmail">
            <span class="text-amber-400 font-medium flex items-center space-x-1">
              <span>⚠</span>
              <span>Debe terminar en @unimar.edu.ve</span>
            </span>
          </template>
        </div>
      </div>

      <!-- Rol Académico -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Rol institucional</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">🛡</span>
          <select name="rol_nombre" required
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border border-caramel-500/25 rounded-2xl text-xs text-stone-200 focus:outline-none focus:border-caramel-400 transition">
            <option value="Estudiante" {% if form_data and form_data.rol_nombre == 'Estudiante' %}selected{% endif %}>Estudiante</option>
            <option value="Docente de Cátedra" {% if form_data and form_data.rol_nombre == 'Docente de Cátedra' %}selected{% endif %}>Docente de Cátedra</option>
            <option value="Curador/Administrador" {% if form_data and form_data.rol_nombre == 'Curador/Administrador' %}selected{% endif %}>Curador / Administrador</option>
          </select>
        </div>
      </div>

      <!-- Carrera Académica -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Carrera / Área</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">🎓</span>
          <select name="carrera" required
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border border-caramel-500/25 rounded-2xl text-xs text-stone-200 focus:outline-none focus:border-caramel-400 transition">
            <option value="Ingeniería de Sistemas" {% if form_data and form_data.carrera == 'Ingeniería de Sistemas' %}selected{% endif %}>Ingeniería de Sistemas</option>
            <option value="Computación" {% if form_data and form_data.carrera == 'Computación' %}selected{% endif %}>Computación</option>
            <option value="Ingeniería Civil" {% if form_data and form_data.carrera == 'Ingeniería Civil' %}selected{% endif %}>Ingeniería Civil</option>
            <option value="Ingeniería Industrial" {% if form_data and form_data.carrera == 'Ingeniería Industrial' %}selected{% endif %}>Ingeniería Industrial</option>
          </select>
        </div>
      </div>

      <!-- Trimestre -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Trimestre en curso</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">📅</span>
          <select name="trimestre" required
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border border-caramel-500/25 rounded-2xl text-xs text-stone-200 focus:outline-none focus:border-caramel-400 transition">
            {% for t in range(1, 13) %}
            <option value="{{ t }}" {% if (form_data and form_data.trimestre == t) or (not form_data and t == 3) %}selected{% endif %}>{{ t }}º Trimestre</option>
            {% endfor %}
            <option value="0" {% if form_data and form_data.trimestre == 0 %}selected{% endif %}>Graduado / Docente</option>
          </select>
        </div>
      </div>

      <!-- Nombre de Usuario -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Nombre de usuario</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">👤</span>
          <input type="text" name="username" required placeholder="tu_usuario"
            value="{{ form_data.username if form_data and form_data.username else '' }}"
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border border-caramel-500/25 rounded-2xl text-xs text-stone-200 placeholder-stone-600 focus:outline-none focus:border-caramel-400 transition">
        </div>
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-[11px] font-medium text-stone-400 mb-1 ml-1">Contraseña</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-stone-400 text-xs">🔒</span>
          <input type="password" name="password" required placeholder="Mínimo 6 caracteres"
            class="w-full pl-9 pr-4 py-2.5 bg-[#1b1410] border border-caramel-500/25 rounded-2xl text-xs text-stone-200 placeholder-stone-600 focus:outline-none focus:border-caramel-400 transition">
        </div>
      </div>

      <!-- Super Smooth Button Component -->
      <div class="pt-2">
        <button type="submit" 
          :disabled="isSubmitting"
          class="group relative overflow-hidden w-full py-3.5 px-6 rounded-full text-xs sm:text-sm font-bold tracking-wide shadow-xl flex items-center justify-center space-x-2 text-[#18110c] bg-gradient-to-r from-[#dca067] via-[#c6864d] to-[#b7713d] hover:brightness-105 active:scale-[0.985] transition-all duration-300 ease-out cursor-pointer hover:shadow-2xl hover:shadow-caramel-500/30 disabled:opacity-75 disabled:cursor-not-allowed">
          
          <!-- Subtle Shimmer Sweep Effect -->
          <span class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out pointer-events-none"></span>

          <!-- Spinner when submitting -->
          <template x-if="isSubmitting">
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-[#18110c]" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
          </template>

          <span x-text="isSubmitting ? 'Creando cuenta...' : 'Crear Cuenta Institucional'"></span>
        </button>
      </div>
    </form>

    <div class="mt-5 text-center">
      <p class="text-xs text-stone-400">
        ¿Ya tienes cuenta? 
        <a href="/login" class="text-caramel-400 hover:text-caramel-300 font-semibold underline ml-1">Inicia sesión</a>
      </p>
    </div>

  </div>

</div>
{% endblock %}
